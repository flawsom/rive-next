<svg width="1120" height="560" viewBox="0 0 1120 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Open Stream AI assistant mockup">
  <defs>
    <linearGradient id="ai-panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#131B32"/>
      <stop offset="1" stop-color="#0C1122"/>
    </linearGradient>
    <linearGradient id="ai-accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7CB0FF"/>
      <stop offset="1" stop-color="#3D6FD8"/>
    </linearGradient>
    <radialGradient id="ai-glow" cx="300" cy="120" r="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F8CFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4F8CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1120" height="560" rx="14" fill="#0A0E1A"/>
  <rect width="1120" height="560" fill="url(#ai-glow)"/>

  <!-- chat column -->
  <rect x="48" y="40" width="600" height="480" rx="14" fill="url(#ai-panel)" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- user bubble -->
  <rect x="340" y="72" width="284" height="52" rx="14" fill="#4F8CFF" opacity="0.28"/>
  <rect x="356" y="88" width="220" height="10" rx="5" fill="#F5F8FF" opacity="0.9"/>
  <rect x="356" y="106" width="140" height="10" rx="5" fill="#F5F8FF" opacity="0.6"/>

  <!-- AI bubble -->
  <rect x="72" y="144" width="500" height="150" rx="14" fill="#101A32" stroke="#4F8CFF" stroke-opacity="0.3"/>
  <circle cx="100" cy="176" r="12" fill="#4F8CFF"/>
  <rect x="124" y="168" width="150" height="12" rx="6" fill="#F5F8FF" opacity="0.9"/>
  <rect x="96" y="200" width="440" height="10" rx="5" fill="#8FA3C4" opacity="0.7"/>
  <rect x="96" y="220" width="410" height="10" rx="5" fill="#8FA3C4" opacity="0.55"/>
  <rect x="96" y="240" width="430" height="10" rx="5" fill="#8FA3C4" opacity="0.4"/>
  <rect x="96" y="264" width="120" height="14" rx="7" fill="#4F8CFF" opacity="0.4"/>

  <!-- grounded recommendation cards inside chat -->
  <g>
    <rect x="96" y="316" width="136" height="180" rx="10" fill="#1B2A48" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="110" y="330" width="108" height="120" rx="8" fill="#22345A"/>
    <rect x="110" y="460" width="86" height="10" rx="5" fill="#F5F8FF" opacity="0.85"/>
    <rect x="110" y="476" width="60" height="8" rx="4" fill="#8FA3C4" opacity="0.5"/>

    <rect x="248" y="316" width="136" height="180" rx="10" fill="#1B2A48" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="262" y="330" width="108" height="120" rx="8" fill="#22345A"/>
    <rect x="262" y="460" width="86" height="10" rx="5" fill="#F5F8FF" opacity="0.85"/>
    <rect x="262" y="476" width="60" height="8" rx="4" fill="#8FA3C4" opacity="0.5"/>

    <rect x="400" y="316" width="136" height="180" rx="10" rx="10" fill="#1B2A48" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="414" y="330" width="108" height="120" rx="8" fill="#22345A"/>
    <rect x="414" y="460" width="86" height="10" rx="5" fill="#F5F8FF" opacity="0.85"/>
    <rect x="414" y="476" width="60" height="8" rx="4" fill="#8FA3C4" opacity="0.5"/>
  </g>

  <!-- right rail: what powers it -->
  <rect x="688" y="40" width="384" height="480" rx="14" fill="url(#ai-panel)" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="712" y="64" width="180" height="14" rx="7" fill="#F5F8FF" opacity="0.92"/>

  <g>
    <rect x="712" y="96" width="336" height="70" rx="10" fill="#101A32" stroke="#4F8CFF" stroke-opacity="0.25"/>
    <circle cx="740" cy="131" r="10" fill="#4F8CFF" opacity="0.9"/>
    <rect x="760" y="112" width="150" height="10" rx="5" fill="#F5F8FF" opacity="0.85"/>
    <rect x="760" y="132" width="240" height="10" rx="5" fill="#8FA3C4" opacity="0.55"/>

    <rect x="712" y="182" width="336" height="70" rx="10" fill="#101A32" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="740" cy="217" r="10" fill="#34D399" opacity="0.9"/>
    <rect x="760" y="198" width="150" height="10" rx="5" fill="#F5F8FF" opacity="0.85"/>
    <rect x="760" y="218" width="240" height="10" rx="5" fill="#8FA3C4" opacity="0.55"/>

    <rect x="712" y="268" width="336" height="70" rx="10" fill="#101A32" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="740" cy="303" r="10" fill="#F59E0B" opacity="0.9"/>
    <rect x="760" y="284" width="150" height="10" rx="5" fill="#F5F8FF" opacity="0.85"/>
    <rect x="760" y="304" width="240" height="10" rx="5" fill="#8FA3C4" opacity="0.55"/>

    <rect x="712" y="354" width="336" height="70" rx="10" fill="#101A32" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="740" cy="389" r="10" fill="#A78BFA" opacity="0.9"/>
    <rect x="760" y="370" width="150" height="10" rx="5" fill="#F5F8FF" opacity="0.85"/>
    <rect x="760" y="390" width="240" height="10" rx="5" fill="#8FA3C4" opacity="0.55"/>
  </g>

  <!-- input bar -->
  <rect x="688" y="452" width="384" height="44" rx="22" fill="#FFFFFF" opacity="0.06"/>
  <rect x="712" y="468" width="240" height="12" rx="6" fill="#8FA3C4" opacity="0.5"/>
  <circle cx="1040" cy="474" r="14" fill="url(#ai-accent)"/>
</svg>
