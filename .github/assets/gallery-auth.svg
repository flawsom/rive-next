<svg width="1120" height="560" viewBox="0 0 1120 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Open Stream authentication mockup">
  <defs>
    <linearGradient id="au-panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#121A30"/>
      <stop offset="1" stop-color="#0C1122"/>
    </linearGradient>
    <linearGradient id="au-btn" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6FA4FF"/>
      <stop offset="1" stop-color="#3D6FD8"/>
    </linearGradient>
    <radialGradient id="au-glow" cx="560" cy="60" r="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F8CFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4F8CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1120" height="560" fill="#0A0E1A"/>
  <rect width="1120" height="560" fill="url(#au-glow)"/>

  <!-- glass card -->
  <rect x="380" y="60" width="360" height="440" rx="18" fill="url(#au-panel)" stroke="#FFFFFF" stroke-opacity="0.12"/>

  <!-- mark -->
  <circle cx="560" cy="128" r="30" stroke="#4F8CFF" stroke-width="4" fill="none"/>
  <path d="M550 112 L576 128 L550 144 Z" fill="#4F8CFF"/>

  <rect x="500" y="182" width="120" height="14" rx="7" fill="#F5F8FF" opacity="0.95"/>
  <rect x="472" y="208" width="176" height="10" rx="5" fill="#8FA3C4" opacity="0.6"/>

  <!-- inputs -->
  <rect x="416" y="242" width="288" height="44" rx="10" fill="#FFFFFF" opacity="0.06"/>
  <rect x="434" y="258" width="100" height="12" rx="6" fill="#8FA3C4" opacity="0.5"/>
  <rect x="416" y="298" width="288" height="44" rx="10" fill="#FFFFFF" opacity="0.06"/>
  <rect x="434" y="314" width="80" height="12" rx="6" fill="#8FA3C4" opacity="0.5"/>

  <!-- primary button -->
  <rect x="416" y="358" width="288" height="44" rx="10" fill="url(#au-btn)"/>
  <rect x="500" y="374" width="120" height="12" rx="6" fill="#F5F8FF" opacity="0.95"/>

  <!-- divider -->
  <line x1="440" y1="428" x2="680" y2="428" stroke="#FFFFFF" stroke-opacity="0.14"/>

  <!-- Google button -->
  <rect x="416" y="444" width="288" height="40" rx="10" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="440" cy="464" r="9" fill="#EA4335"/>
  <circle cx="448" cy="464" r="9" fill="#4285F4" opacity="0.9"/>
  <circle cx="456" cy="464" r="9" fill="#34A853" opacity="0.9"/>
  <circle cx="464" cy="464" r="9" fill="#FBBC05" opacity="0.9"/>
  <rect x="490" y="458" width="120" height="12" rx="6" fill="#F5F8FF" opacity="0.9"/>

  <!-- guest note -->
  <rect x="452" y="500" width="216" height="10" rx="5" fill="#8FA3C4" opacity="0.5"/>
</svg>
