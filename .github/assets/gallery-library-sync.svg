<svg width="1120" height="560" viewBox="0 0 1120 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Open Stream library and cloud sync mockup">
  <defs>
    <linearGradient id="lib-panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#121A30"/>
      <stop offset="1" stop-color="#0C1122"/>
    </linearGradient>
    <linearGradient id="lib-accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7CB0FF"/>
      <stop offset="1" stop-color="#3D6FD8"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="560" rx="14" fill="#0A0E1A"/>

  <!-- header -->
  <rect x="64" y="48" width="220" height="24" rx="12" fill="#F5F8FF" opacity="0.95"/>
  <rect x="64" y="88" width="340" height="12" rx="6" fill="#8FA3C4" opacity="0.6"/>

  <!-- filter chips -->
  <rect x="64" y="124" width="90" height="30" rx="15" fill="#4F8CFF" opacity="0.85"/>
  <rect x="164" y="124" width="90" height="30" rx="15" fill="#FFFFFF" opacity="0.08"/>
  <rect x="264" y="124" width="90" height="30" rx="15" fill="#FFFFFF" opacity="0.08"/>
  <rect x="364" y="124" width="90" height="30" rx="15" fill="#FFFFFF" opacity="0.08"/>
  <rect x="920" y="124" width="136" height="30" rx="15" fill="#FFFFFF" opacity="0.10"/>

