  <g>
    <rect x="64" y="184" width="180" height="270" rx="12" fill="url(#lib-panel)" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="80" y="200" width="148" height="200" rx="8" fill="#1B2A48"/>
    <rect x="80" y="412" width="110" height="10" rx="5" fill="#F5F8FF" opacity="0.85"/>
    <rect x="80" y="430" width="70" height="8" rx="4" fill="#8FA3C4" opacity="0.5"/>

    <rect x="276" y="184" width="180" height="270" rx="12" fill="url(#lib-panel)" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="292" y="200" width="148" height="200" rx="8" fill="#1B2A48"/>
    <rect x="292" y="412" width="110" height="10" rx="5" fill="#F5F8FF" opacity="0.85"/>
    <rect x="292" y="430" width="70" height="8" rx="4" fill="#8FA3C4" opacity="0.5"/>

    <rect x="488" y="184" width="180" height="270" rx="12" fill="url(#lib-panel)" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="504" y="200" width="148" height="200" rx="8" fill="#1B2A48"/>
    <rect x="504" y="412" width="110" height="10" rx="5" fill="#F5F8FF" opacity="0.85"/>
    <rect x="504" y="430" width="70" height="8" rx="4" fill="#8FA3C4" opacity="0.5"/>

    <rect x="700" y="184" width="180" height="270" rx="12" fill="url(#lib-panel)" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="716" y="200" width="148" height="200" rx="8" fill="#1B2A48"/>
    <rect x="716" y="412" width="110" height="10" rx="5" fill="#F5F8FF" opacity="0.85"/>
    <rect x="716" y="430" width="70" height="8" rx="4" fill="#8FA3C4" opacity="0.5"/>

    <rect x="912" y="184" width="144" height="270" rx="12" fill="url(#lib-panel)" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="928" y="200" width="112" height="200" rx="8" fill="#1B2A48"/>
    <rect x="928" y="412" width="90" height="10" rx="5" fill="#F5F8FF" opacity="0.85"/>
