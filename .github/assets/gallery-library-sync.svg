  <rect x="64" y="486" width="992" height="40" rx="12" fill="#101A32" stroke="#4F8CFF" stroke-opacity="0.25"/>
  <circle cx="92" cy="506" r="8" fill="#34D399"/>
  <rect x="112" y="500" width="200" height="12" rx="6" fill="#F5F8FF" opacity="0.85"/>
  <rect x="330" y="500" width="260" height="12" rx="6" fill="#8FA3C4" opacity="0.55"/>
  <rect x="840" y="498" width="190" height="16" rx="8" fill="url(#lib-accent)" opacity="0.85"/>
